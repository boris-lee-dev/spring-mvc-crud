<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
</head>
<body>
<h2>Edit user</h2>

<form th:method="PATCH" th:action="@{/users/{id}(id=${user.id})}" th:object="${user}">
    <label for="name">Name: </label>
    <input type="text" th:field="*{name}" id="name"/><br/><br/>

    <label for="lastName">Last name: </label>
    <input type="text" th:field="*{lastName}" id="lastName"/><br/><br/>

    <label for="email">Email: </label>
    <input type="text" th:field="*{email}" id="email"/><br/><br/>

    <input type="submit" value="Update!"/>
</form>

<br/>
<a th:href="@{/users}">Back</a>
</body>
</html>
